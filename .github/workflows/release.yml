name: Release

# Manual release. Actions tab -> "Release" -> Run workflow, enter a version like
# 26.7.5 (CalVer: YY.M.D — same scheme auto-version.yml stamps on every push to
# main). Builds the .apk packages via Dockerfile-apk (buildx layer cache keeps
# it to a few minutes) and publishes a tagged GitHub release with them attached.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например 26.7.5)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update version and build
        run: |
          echo "${{ inputs.version }}" > VERSION
          ./build.sh

      - name: Extract built packages
        run: |
          mkdir -p release
          cp -v out/*.apk out/*.ipk release/ || true
          cp -v install.sh release/ || true
          echo "--- shipped ---"; ls -l release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: splify v${{ inputs.version }}
          prerelease: false
          make_latest: true
          files: |
            release/*.apk
            release/*.ipk
            release/install.sh
          body: |
            Релиз splify v${{ inputs.version }}.

            Установка одной командой на роутере (OpenWrt 24.10+/25.12+ / apk):
            ```
            wget -O - https://raw.githubusercontent.com/xyzmean/splify/main/install.sh | sh
            ```

            Или вручную из приложённых файлов (.apk для новых систем, .ipk для старых):
            ```
            apk add --allow-untrusted ./splify-*.apk ./luci-app-splify-*.apk ./luci-i18n-splify-ru-*.apk
            # или для opkg: opkg install ./splify-*.ipk ./luci-app-splify-*.ipk ./luci-i18n-splify-ru-*.ipk
            ```
