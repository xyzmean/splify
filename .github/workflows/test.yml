name: Lint & test

# Release-hygiene gate (design §4.4): static lint of the shell core + pure-logic
# unit tests, on every PR / push to a feature or main branch. Fast (no SDK build)
# so it runs ahead of the heavier package build in build.yml.
on:
  pull_request:
  push:
    branches: [ main, 'feature/**' ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: shellcheck (busybox-ash shell core)
        run: |
          shellcheck -s sh \
            splify/files/usr/local/sbin/splify-* \
            splify/files/usr/local/lib/splify/*.sh \
            splify/files/usr/libexec/rpcd/splify \
            splify/files/etc/init.d/splify \
            splify/files/etc/init.d/splify-* \
            splify-dns/files/etc/init.d/splify-dns \
            splify/files/etc/uci-defaults/*

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: doctor self-test (pure logic, off-box)
        run: SPLIFY_SELFTEST=1 sh splify/files/usr/local/sbin/splify-doctor
      - name: build splify-dnsd (native, for --selftest)
        run: |
          gcc -Wall -Wextra -O2 -o /tmp/splify-dnsd splify-dns/src/splify-dnsd.c
          /tmp/splify-dnsd --selftest
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y bats
      - name: bats unit tests
        run: SPLIFY_DNSD_BIN=/tmp/splify-dnsd bats tests/
